name: Test Scoop installation
description: Install the exact tested executable via Scoop from a temporary local HTTP source.
inputs:
  asset-path:
    description: Tested local Windows executable
    required: true
  manifest-path:
    description: Manifest generated by scoop-manifest
    required: true
  app-name:
    description: Scoop application name
    required: true
  help-argument:
    description: CLI smoke test argument
    default: --help
runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: latest-known
        enable-cache: false
    - name: Install and exercise Scoop application
      shell: pwsh
      env:
        ASSET_PATH: ${{ inputs.asset-path }}
        MANIFEST_PATH: ${{ inputs.manifest-path }}
        APP_NAME: ${{ inputs.app-name }}
        HELP_ARGUMENT: ${{ inputs.help-argument }}
      run: |
        $ErrorActionPreference = 'Stop'
        uv run --no-project --python 3.14.7 python (Join-Path $env:GITHUB_ACTION_PATH 'smoke.py') `
          --asset $env:ASSET_PATH --manifest $env:MANIFEST_PATH `
          --app-name $env:APP_NAME --help-argument $env:HELP_ARGUMENT
        if ($LASTEXITCODE -ne 0) { throw 'Scoop installation smoke test failed.' }
