name: Generate RSS feed

on:
  workflow_call:
    inputs:
      mode:
        description: project or portfolio
        type: string
        default: project
      limit:
        description: Maximum RSS items
        type: number
        default: 100
      include-prereleases:
        description: Include prereleases in project feeds
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rss:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout shared RSS generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Generate RSS
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          LIMIT: ${{ inputs.limit }}
          PRERELEASES: ${{ inputs.include-prereleases }}
        run: |
          args=()
          if [[ "$PRERELEASES" == true ]]; then args+=(--include-prereleases); fi
          python3 scripts/rss.py "$MODE" --output feed/rss.xml --limit "$LIMIT" "${args[@]}"
      - name: Upload RSS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rss-feed
          path: feed/rss.xml
          if-no-files-found: error
