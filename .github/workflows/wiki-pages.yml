name: Wiki documentation website

on:
  workflow_call:
    inputs:
      publish:
        description: Deploy the generated documentation to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-workflows
          persist-credentials: false
      - name: Set up uv for Markdown processing
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          enable-cache: false
      - name: Prepare Starlight and agent documentation
        env:
          DESCRIPTION: ${{ github.event.repository.description }}
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/wiki-docs"
          mkdir -p "$SITE/src/styles"
          cp .ci-workflows/templates/wiki-docs/astro.config.mjs "$SITE/"
          cp .ci-workflows/website/package.json .ci-workflows/website/package-lock.json "$SITE/"
          cp .ci-workflows/website/src/content.config.ts "$SITE/src/"
          cp .ci-workflows/website/src/styles/starlight.css "$SITE/src/styles/"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          uv run --no-project --with-requirements .ci-workflows/scripts/markdown-requirements.txt python .ci-workflows/scripts/wiki_docs.py --wiki wiki --site "$SITE" \
            --origin "https://$owner.github.io/$repo/" --repo "https://github.com/$GITHUB_REPOSITORY" \
            --description "${DESCRIPTION:-$repo documentation}"
          {
            echo "DOCS_SITE=https://$owner.github.io"
            echo "DOCS_BASE=/$repo"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build documentation
        run: |
          npm ci --prefix "$RUNNER_TEMP/wiki-docs" --no-audit --no-fund
          npm --prefix "$RUNNER_TEMP/wiki-docs" run build
      - name: Generate and validate structured data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project --with-requirements .ci-workflows/scripts/markdown-requirements.txt python .ci-workflows/scripts/structured_data.py wiki --dist "$RUNNER_TEMP/wiki-docs/dist" --origin "$DOCS_SITE$DOCS_BASE/"
      - name: Validate agent documentation and sitemap
        run: |
          python3 .ci-workflows/scripts/validate_wiki_docs.py "$RUNNER_TEMP/wiki-docs/dist" "$DOCS_SITE$DOCS_BASE/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/wiki-docs/dist
  deploy:
    needs: build
    if: ${{ inputs.publish && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
