name: PowerShell CI

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label
        type: string
        default: windows-2025
      minimum-powershell-version:
        description: Minimum PowerShell version
        type: string
        default: '7.6.9'
      test-path:
        description: Optional directory containing Pester *.Tests.ps1 files
        type: string
        default: tests

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 25
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PowerShell code quality
        uses: $/actions/powershell-checks
        with:
          minimum-powershell-version: ${{ inputs.minimum-powershell-version }}
          test-path: ${{ inputs.test-path }}
          require-tests: 'false'
