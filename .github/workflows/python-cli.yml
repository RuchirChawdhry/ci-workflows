name: Python CLI CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to test
        type: string
        default: '3.14.7'
      runs-on:
        description: GitHub-hosted runner label
        type: string
        default: ubuntu-slim
      project-path:
        description: Directory containing the project's pyproject.toml
        type: string
        default: '.'
      dev-group:
        description: uv dependency group to include, in addition to configured default groups
        type: string
        default: dev
      test-command:
        description: Shell command executed in the uv environment, or empty to skip tests
        type: string
        default: pytest -q
      workspace-package:
        description: Optional uv workspace member name to sync instead of workspace root
        type: string
        default: ''
      cli-command:
        description: Optional installed CLI command to smoke-test with --help
        type: string
        default: ''

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 14
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python CLI quality checks
        uses: $/actions/python-checks
        with:
          python-version: ${{ inputs.python-version }}
          project-path: ${{ inputs.project-path }}
          dev-group: ${{ inputs.dev-group }}
          test-command: ${{ inputs.test-command }}
          workspace-package: ${{ inputs.workspace-package }}
          cli-command: ${{ inputs.cli-command }}
