name: Python CLI CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to test
        type: string
        default: '3.14.7'
      runs-on:
        description: GitHub-hosted runner label
        type: string
        default: ubuntu-slim
      cli-command:
        description: Optional installed CLI command to smoke-test with --help
        type: string
        default: ''

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 14
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python CLI quality checks
        uses: RuchirChawdhry/ci-workflows/actions/python-checks@main
        with:
          python-version: ${{ inputs.python-version }}
          cli-command: ${{ inputs.cli-command }}
