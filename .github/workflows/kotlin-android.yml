name: Kotlin Android
on:
  workflow_call:
    inputs:
      template:
        type: boolean
        default: false
      mode:
        type: string
        default: checks
      api:
        type: number
        default: 35
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PROJECT: ${{ inputs.template && 'generated' || '.' }}
      ANDROID_CI_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - if: inputs.template
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false # Copier is invoked via uvx; this repository has no Python lockfile.
      - if: inputs.template
        name: Generate project
        run: uvx --from copier==9.19.1 copier copy --defaults --vcs-ref=HEAD . generated
      - if: inputs.template && inputs.mode == 'checks'
        name: Validate alternate and invalid inputs
        run: |
          uvx --from copier==9.19.1 copier copy --defaults --vcs-ref=HEAD -d project_name='Another App' -d application_id=org.example.another . alternate
          test -f alternate/app/src/main/java/org/example/another/MainActivity.kt
          if uvx --from copier==9.19.1 copier copy --defaults --vcs-ref=HEAD -d application_id='bad-id' . invalid; then
            echo 'Invalid application ID accepted' >&2
            exit 1
          fi
      - name: Install project SDK
        working-directory: ${{ env.PROJECT }}
        run: |
          if [ -f scripts/sdk.sh ]; then
            bash scripts/sdk.sh install
          else
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'emulator'
          fi
      - name: Validate host tooling
        working-directory: ${{ env.PROJECT }}
        run: |
          if [ -f scripts/test-tooling.py ]; then
            python3 scripts/test-tooling.py
          fi
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - if: inputs.mode == 'checks'
        name: Check, test and build
        working-directory: ${{ env.PROJECT }}
        run: |
          if [ -f scripts/ci-check.sh ]; then
            bash scripts/ci-check.sh
          else
            ./gradlew ktlintCheck detekt lintDebug testDebugUnitTest assembleDebug assembleRelease --continue --stacktrace
          fi
      - if: inputs.template && inputs.mode == 'checks'
        name: Build alternate application ID
        working-directory: alternate
        run: |
          if [ -f scripts/ci-check.sh ]; then
            bash scripts/ci-check.sh
          else
            ./gradlew ktlintCheck detekt lintDebug testDebugUnitTest assembleDebug assembleRelease --continue --stacktrace
          fi
      - if: inputs.mode == 'screenshots'
        name: Build screenshot application and instrumentation
        working-directory: ${{ env.PROJECT }}
        run: |
          if [ -f scripts/ci-check.sh ]; then
            bash scripts/ci-check.sh screenshots
          else
            ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
          fi
      - if: inputs.template && inputs.mode == 'checks'
        name: Generate optional capability profile
        run: |
          if ! grep -q '^include_http:' copier.yml; then exit 0; fi
          uvx --from copier==9.19.1 copier copy --defaults --vcs-ref=HEAD -d include_http=true -d include_background_jobs=true -d include_file_access=true -d include_notifications=true . optional
          cd optional
          ./gradlew :app:assembleDebug --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ inputs.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          working-directory: ${{ env.PROJECT }}
          script: bash scripts/ci-device.sh
      - name: Report
        if: always()
        run: |
          echo '## Android validation' >> "$GITHUB_STEP_SUMMARY"
          echo 'Mode: ${{ inputs.mode }}; API: ${{ inputs.api }}' >> "$GITHUB_STEP_SUMMARY"
          find "$PROJECT/app/build/outputs/apk" -name '*.apk' -printf '%f: %s bytes\n' >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload screenshot set
        if: success() && inputs.mode == 'screenshots'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-ui-screenshots
          path: ${{ env.PROJECT }}/screenshots/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-api-${{ inputs.api }}-${{ inputs.mode }}
          path: |
            ${{ env.PROJECT }}/app/build/outputs/
            ${{ env.PROJECT }}/build/reports/
            ${{ env.PROJECT }}/benchmark/build/reports/
            ${{ env.PROJECT }}/app/build/reports/
            ${{ env.PROJECT }}/app/build/test-results/
            ${{ env.PROJECT }}/reports/
            alternate/reports/
            optional/app/build/outputs/
          if-no-files-found: warn
