name: Publish portfolio sitemap

on:
  workflow_call:
    inputs:
      rss:
        description: Include the portfolio RSS feed in the existing Pages deployment
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: ${{ github.repository == format('{0}/{1}.github.io', github.repository_owner, github.repository_owner) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out root website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Discover project sitemaps and build root website
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          from pathlib import Path
          import shutil
          from urllib.error import HTTPError
          from urllib.parse import quote, urlsplit
          from urllib.request import Request, urlopen
          import xml.etree.ElementTree as ET
          
          NS = "http://www.sitemaps.org/schemas/sitemap/0.9"
          ET.register_namespace("", NS)
          LIMIT = 52_428_800
          MAX_ENTRIES = 50_000
          
          
          def tag(name):
              return f"{{{NS}}}{name}"
          
          
          def request(url, headers=None):
              with urlopen(Request(url, headers=headers or {}), timeout=20) as response:
                  data = response.read(LIMIT + 1)
                  if len(data) > LIMIT:
                      raise ValueError(f"Response exceeds sitemap size limit: {url}")
                  return response.geturl(), data
          
          
          def repositories(owner, token):
              headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
              page = 1
              while True:
                  _, data = request(
                      f"https://api.github.com/users/{quote(owner)}/repos?type=owner&per_page=100&page={page}",
                      headers,
                  )
                  repos = json.loads(data)
                  yield from repos
                  if len(repos) < 100:
                      return
                  page += 1
          
          
          def in_project(url, base):
              parsed = urlsplit(url)
              scope = urlsplit(base)
              return (
                  parsed.scheme == "https"
                  and parsed.netloc == scope.netloc
                  and (parsed.path == scope.path.rstrip('/') or parsed.path.startswith(scope.path))
                  and not parsed.query and not parsed.fragment
                  and not any(part in {".", ".."} for part in parsed.path.split("/"))
              )
          
          
          def sitemap_leaves(url, base, seen=None):
              seen = set() if seen is None else seen
              if url in seen or not in_project(url, base):
                  return {}
              if len(seen) >= 100:
                  raise ValueError(f"Too many sitemap references for {base}")
              seen.add(url)
              try:
                  final, data = request(url)
              except HTTPError as error:
                  if error.code in {404, 410}:
                      print(f"Sitemap unavailable ({error.code}): {url}")
                      return {}
                  raise
              if final != url or b"<!DOCTYPE" in data.upper():
                  print(f"Sitemap redirected or contains a prohibited DOCTYPE: {url} -> {final}")
                  return {}
              try:
                  root = ET.fromstring(data)
              except ET.ParseError:
                  print(f"Sitemap is not valid XML: {url}")
                  return {}
              if root.tag == tag("urlset"):
                  locations = [entry.findtext(tag("loc"), "").strip() for entry in root.findall(tag("url"))]
                  if not locations or not all(in_project(loc, base) for loc in locations):
                      print(f"Sitemap contains no URLs or out-of-scope URLs: {url}")
                      return {}
                  return {url: set(locations)}
              if root.tag != tag("sitemapindex"):
                  print(f"Unexpected XML root in {url}: {root.tag}")
                  return {}
              leaves = {}
              for entry in root.findall(tag("sitemap")):
                  leaves.update(sitemap_leaves(entry.findtext(tag("loc"), "").strip(), base, seen))
              return leaves
          
          
          def eligible_projects(owner, repos):
              host = f"https://{owner.lower()}.github.io/"
              for repo in sorted(repos, key=lambda item: item["name"].lower()):
                  name = repo["name"]
                  if repo.get("private") or not repo.get("has_pages") or name.lower() == f"{owner.lower()}.github.io":
                      continue
                  yield repo, host + quote(name, safe="") + "/"
          
          
          def discover(owner, repos):
              projects = []
              for repo, base in eligible_projects(owner, repos):
                  name = repo["name"]
                  leaves = sitemap_leaves(base + "sitemap-index.xml", base)
                  if not leaves:
                      leaves = sitemap_leaves(base + "sitemap.xml", base)
                  if leaves:
                      projects.append((name, base, leaves))
                      print(f"Discovered {name}: {len(leaves)} sitemap(s)")
                  else:
                      print(f"::notice::No eligible sitemap for {name}")
              return projects
          
          
          def discover_llms(owner, repos):
              projects = []
              for repo, base in eligible_projects(owner, repos):
                  url = base + "llms.txt"
                  try:
                      final, data = request(url)
                  except HTTPError as error:
                      if error.code in {404, 410}:
                          continue
                      raise
                  if final != url:
                      print(f"Skipping redirected llms.txt: {url} -> {final}")
                      continue
                  try:
                      content = data.decode("utf-8-sig").strip()
                  except UnicodeDecodeError:
                      print(f"Skipping non-UTF-8 llms.txt: {url}")
                      continue
                  heading = content.splitlines()[0] if content else ""
                  if not heading.startswith("# ") or not heading[2:].strip():
                      print(f"Skipping llms.txt without a Markdown H1: {url}")
                      continue
                  description = " ".join((repo.get("description") or "").split())
                  projects.append((repo["name"], url, description))
                  print(f"Discovered llms.txt: {url}")
              return projects
          
          
          def write_llms(path, owner, projects):
              host = f"https://{owner.lower()}.github.io/"
              lines = [
                  f"# {owner} — Open-source project documentation",
                  "",
                  "> Index of AI-readable documentation for public software projects.",
                  "",
                  "Use the project-specific documentation index to select relevant Markdown pages. "
                  "Consult the project repository for source code and licensing.",
                  "",
                  "## Projects",
                  "",
              ]
              for name, url, description in projects:
                  description = html.escape(description, quote=False)
                  for character in "\\*_[\x60]":
                      description = description.replace(character, "\\" + character)
                  lines.append(f"- [{name}]({url})" + (f": {description}" if description else ""))
              lines.extend(["", "## Optional", "", f"- [Project directory]({host})", ""])
              path.write_text("\n".join(lines), encoding="utf-8")
              print(f"Generated llms.txt: {len(projects)} project documentation indexes")
          
          
          def write_xml(path, kind, item, urls):
              root = ET.Element(tag(kind))
              locations = sorted(set(urls))
              if len(locations) > MAX_ENTRIES:
                  raise ValueError(f"{path.name} exceeds the 50,000-entry sitemap limit")
              for url in locations:
                  ET.SubElement(ET.SubElement(root, tag(item)), tag("loc")).text = url
              ET.indent(root)
              data = ET.tostring(root, encoding="utf-8", xml_declaration=True)
              if len(data) > LIMIT:
                  raise ValueError(f"{path.name} exceeds the 50 MB sitemap limit")
              path.write_bytes(data)
          
          
          def write_robots(path, host, leaves):
              groups = {
                  "AI search, assistants and model crawlers": (
                      "OAI-SearchBot",
                      "GPTBot",
                      "ChatGPT-User",
                      "ClaudeBot",
                      "Claude-SearchBot",
                      "Claude-User",
                      "anthropic-ai",
                      "Claude-Web",
                      "PerplexityBot",
                      "Perplexity-User",
                      "Google-Extended",
                      "Google-CloudVertexBot",
                      "GoogleOther",
                      "GoogleOther-Image",
                      "GoogleOther-Video",
                      "Applebot-Extended",
                      "Amazonbot",
                      "Amzn-SearchBot",
                      "Amzn-User",
                      "Bytespider",
                      "Meta-ExternalAgent",
                      "Meta-ExternalFetcher",
                      "Meta-WebIndexer",
                      "FacebookBot",
                      "DuckAssistBot",
                      "MistralAI-User",
                      "MistralAI-Index",
                      "cohere-ai",
                      "YouBot",
                      "ExaSearchBot",
                      "Diffbot",
                      "omgili",
                      "omgilibot",
                  ),
                  "Search engines": (
                      "Googlebot",
                      "Googlebot-Image",
                      "Googlebot-Video",
                      "Googlebot-News",
                      "bingbot",
                      "BingPreview",
                      "msnbot",
                      "Applebot",
                      "DuckDuckBot",
                      "DuckDuckGo-Favicons-Bot",
                      "Baiduspider",
                      "YandexBot",
                      "YandexImages",
                      "YandexVideo",
                      "Slurp",
                      "Sogou",
                      "Exabot",
                      "PetalBot",
                      "SeznamBot",
                      "NaverBot",
                      "Yeti",
                      "Qwantbot",
                      "MojeekBot",
                  ),
                  "SEO and site audit crawlers": (
                      "AhrefsBot",
                      "AhrefsSiteAudit",
                      "SemrushBot",
                      "SiteAuditBot",
                      "SplitSignalBot",
                      "MJ12bot",
                      "DotBot",
                      "Rogerbot",
                      "BLEXBot",
                      "DataForSeoBot",
                      "serpstatbot",
                      "SiteCheckerBotCrawler",
                      "RyteBot",
                      "Screaming Frog SEO Spider",
                  ),
                  "Research, datasets and web archives": (
                      "CCBot",
                      "archive.org_bot",
                      "ia_archiver",
                      "Heritrix",
                      "Nutch",
                      "Scrapy",
                      "TurnitinBot",
                  ),
              }
              lines = ["# Public crawler access policy"]
              for label, agents in groups.items():
                  lines.extend(["", f"# {label}"])
                  lines.extend(f"User-agent: {agent}" for agent in agents)
                  lines.append("Allow: /")
              lines.extend(["", "# All other crawlers", "User-agent: *", "Allow: /", "", "# Sitemaps"])
              lines.extend(f"Sitemap: {url}" for url in dict.fromkeys([host + "sitemaps.xml", host + "sitemap.xml", *sorted(leaves)]))
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")
              print(f"Generated robots.txt: {sum(map(len, groups.values()))} named crawler tokens and wildcard; {len(leaves) + 2} sitemap declarations")
          
          
          def generate(owner, projects, output, llms_projects=()):
              host = f"https://{owner.lower()}.github.io/"
              output.mkdir(parents=True, exist_ok=True)
              if Path("public").is_dir():
                  shutil.copytree("public", output, dirs_exist_ok=True)
              leaves = {url: locations for _, _, project in projects for url, locations in project.items()}
              pages = {host}
              for locations in leaves.values():
                  pages.update(locations)
              write_xml(output / "sitemap.xml", "urlset", "url", pages)
              write_xml(output / "sitemaps.xml", "sitemapindex", "sitemap", [host + "sitemap.xml", *leaves])
              write_robots(output / "robots.txt", host, leaves)
              write_llms(output / "llms.txt", owner, llms_projects)
              links = "\n".join(
                  f'<li><a href="{html.escape(base, quote=True)}">{html.escape(name)}</a></li>'
                  for name, base, _ in projects
              )
              (output / "index.html").write_text(
                  f'<!doctype html>\n<html lang="en"><head><meta charset="utf-8">'
                  f'<meta name="viewport" content="width=device-width, initial-scale=1">'
                  f'<title>{html.escape(owner)} — Open-source project documentation</title>'
                  f'<meta name="description" content="Directory of published open-source project documentation.">'
                  f'<link rel="canonical" href="{host}">'
                  f'<link rel="describedby" href="{host}llms.txt"></head><body>'
                  f'<main><h1>Open-source project documentation</h1><p>Published project websites by '
                  f'<a href="https://github.com/{html.escape(owner, quote=True)}">{html.escape(owner)}</a>.</p>'
                  f'<ul>{links}</ul><p><a href="/sitemap.xml">All page URLs</a> · <a href="/sitemaps.xml">Sitemap index</a> · <a href="/llms.txt">AI documentation index</a></p></main></body></html>\n',
                  encoding="utf-8",
              )
              print(f"Generated sitemap.xml: {len(pages)} unique page URLs; sitemaps.xml: {len(leaves) + 1} sitemap files")
              return len(pages), len(leaves) + 1
          
          
          if __name__ == "__main__":
              owner = os.environ["GITHUB_REPOSITORY_OWNER"]
              repos = list(repositories(owner, os.environ["GH_TOKEN"]))
              projects = discover(owner, repos)
              llms_projects = discover_llms(owner, repos)
              page_count, sitemap_count = generate(owner, projects, Path("dist"), llms_projects)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(f"## Sitemap index\n\nDiscovered {len(projects)} project site(s).\n\n- sitemap.xml: {page_count} unique page URLs\n- sitemaps.xml: {sitemap_count} sitemap files\n- llms.txt: {len(llms_projects)} project documentation indexes\n")
                  for name, _, leaves in projects:
                      summary.write(f"- {name}: {len(leaves)} sitemap(s)\n")
          PY
      - name: Checkout shared structured data generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-workflows
          persist-credentials: false
      - name: Set up uv for feed generation
        if: ${{ inputs.rss }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          enable-cache: false
      - name: Generate portfolio subscription feeds
        if: ${{ inputs.rss }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project --with-requirements .ci-workflows/scripts/feed-requirements.txt python .ci-workflows/scripts/release_feeds.py --output dist --limit 200
          python3 - <<'PY'
          from pathlib import Path
          path = Path("dist/index.html")
          page = path.read_text(encoding="utf-8")
          page = page.replace("</head>", '<link rel="alternate" type="application/rss+xml" title="Project releases" href="/feed.rss"><link rel="alternate" type="application/atom+xml" title="Project releases" href="/feed.atom"><link rel="alternate" type="application/feed+json" title="Project releases" href="/feed.json"></head>', 1)
          page = page.replace("</main>", '<p><a href="/feeds/">Subscribe to project releases</a> · <a href="/feed.rss">RSS</a> · <a href="/feed.atom">Atom</a> · <a href="/feeds.opml">OPML</a></p></main>', 1)
          path.write_text(page, encoding="utf-8")
          PY
      - name: Generate and validate portfolio structured data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .ci-workflows/scripts/structured_data.py portfolio --dist dist --origin "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish root website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
