name: Python distribution build

on:
  workflow_call:
    inputs:
      python-version:
        description: Python used to build and test the package
        type: string
        default: '3.14.7'
      runs-on:
        description: Runner label; choose a full runner for native builds
        type: string
        default: ubuntu-slim
      source:
        description: Package source directory containing pyproject.toml
        type: string
        default: '.'
      cli-command:
        description: Optional console script to run with --help after isolated wheel installation
        type: string
        default: ''
      artifact-name:
        description: Artifact name for validated distributions
        type: string
        default: python-distributions
    outputs:
      artifact-id:
        description: ID of the uploaded distribution artifact
        value: ${{ jobs.build.outputs.artifact-id }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 14
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          enable-cache: false
      - name: Build wheel and source distribution
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
          SOURCE_DIR: ${{ inputs.source }}
          DIST_DIR: ${{ runner.temp }}/python-dist
        run: |
          set -euo pipefail
          uv python install "$PYTHON_VERSION"
          uv build "$SOURCE_DIR" --python "$PYTHON_VERSION" --sdist --wheel --out-dir "$DIST_DIR"
      - name: Validate distribution metadata
        env:
          DIST_DIR: ${{ runner.temp }}/python-dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=("$DIST_DIR"/*.whl)
          sdists=("$DIST_DIR"/*.tar.gz)
          if (( ${#wheels[@]} != 1 || ${#sdists[@]} != 1 )); then
            echo 'Expected exactly one wheel and one .tar.gz source distribution' >&2
            exit 1
          fi
          uvx --from twine twine check --strict "${wheels[0]}" "${sdists[0]}"
      - name: Test installed CLI
        if: ${{ inputs.cli-command != '' }}
        uses: $/.github/actions/test-python-cli
        with:
          cli-command: ${{ inputs.cli-command }}
          python-version: ${{ inputs.python-version }}
          dist-dir: ${{ runner.temp }}/python-dist
      - name: Upload validated distributions
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/python-dist/*
          if-no-files-found: error
          retention-days: 7
