name: RSS generator tests

on:
  pull_request:
    paths:
      - scripts/rss.py
      - scripts/feed-requirements.txt
      - scripts/release_feeds.py
      - tests/test_release_feeds.py
      - .github/workflows/sitemap-index.yml
      - tests/test_rss.py
      - .github/workflows/rss.yml
      - .github/workflows/rss-tests.yml
  push:
    branches: [main]
    paths:
      - scripts/rss.py
      - scripts/feed-requirements.txt
      - scripts/release_feeds.py
      - tests/test_release_feeds.py
      - .github/workflows/sitemap-index.yml
      - tests/test_rss.py
      - .github/workflows/rss.yml
      - .github/workflows/rss-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv for feed generation
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          enable-cache: false
      - run: uv run --no-project --with-requirements scripts/feed-requirements.txt python -m unittest discover -s tests -p test_rss.py -v
      - run: uv run --no-project --with-requirements scripts/feed-requirements.txt python -m unittest discover -s tests -p test_release_feeds.py -v
