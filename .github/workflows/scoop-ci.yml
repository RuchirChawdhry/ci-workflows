name: Scoop CI

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Existing Windows artifact uploaded earlier in the calling workflow run
        type: string
        required: true
      asset-path:
        description: Relative path to the portable .exe in the artifact
        type: string
        required: true
      app-name:
        description: Lowercase Scoop package name
        type: string
        required: true
      version:
        description: Dotted release version without v prefix
        type: string
        required: true
      release-url:
        description: HTTPS location serving identical release bytes when publicly published
        type: string
        required: true
      description:
        type: string
        default: ''
      homepage:
        type: string
        default: ''
      license:
        type: string
        default: ''
      help-argument:
        description: Smoke-test argument to invoke on the installed app and shim
        type: string
        default: --help
    outputs:
      manifest-artifact-id:
        description: Uploaded Scoop manifest artifact ID
        value: ${{ jobs.validate.outputs.manifest-artifact-id }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 35
    outputs:
      manifest-artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Download tested Windows release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: release-assets
      - name: Generate portable Scoop manifest
        id: manifest
        uses: $/actions/scoop-manifest
        with:
          asset-path: release-assets/${{ inputs.asset-path }}
          app-name: ${{ inputs.app-name }}
          version: ${{ inputs.version }}
          release-url: ${{ inputs.release-url }}
          description: ${{ inputs.description }}
          homepage: ${{ inputs.homepage }}
          license: ${{ inputs.license }}
      - name: Exercise real Scoop install from isolated local asset source
        uses: $/actions/scoop-test
        with:
          asset-path: release-assets/${{ inputs.asset-path }}
          manifest-path: ${{ steps.manifest.outputs.manifest-path }}
          app-name: ${{ inputs.app-name }}
          help-argument: ${{ inputs.help-argument }}
      - name: Upload validated Scoop manifest
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scoop-manifest-${{ inputs.app-name }}
          path: ${{ steps.manifest.outputs.manifest-path }}
          if-no-files-found: error
          retention-days: 7
